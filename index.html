<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моя музыка</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f13;
      color: #f2f2f7;
      padding: 16px;
      padding-bottom: 100px;
    }

    .header {
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 6px;
    }

    .header p {
      color: #9a9aa5;
      font-size: 14px;
    }

    .artist {
      margin: 22px 0 10px;
      font-size: 18px;
      font-weight: 700;
    }

    .track {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1b1b22;
      border-radius: 14px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .track img {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      object-fit: cover;
      background: #2a2a33;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .artist-name {
      color: #9a9aa5;
      font-size: 13px;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .play {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: #2f7cf6;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .empty {
      background: #1b1b22;
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      color: #9a9aa5;
    }

    .footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px 16px;
      background: rgba(15, 15, 19, 0.95);
    }

    .main-button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #2f7cf6;
      color: white;
      font-size: 16px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎵 Для тебя</h1>
    <p>Рекомендации на основе твоих лайков</p>
  </div>

  <div id="content">
    <div class="empty">Загружаю рекомендации...</div>
  </div>

  <div class="footer">
    <button class="main-button" onclick="refresh()">
      Обновить рекомендации
    </button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const API_URL = "https://ТВОЙ-API-АДРЕС/recommendations";

    function getInitData() {
      return tg.initData || "";
    }

    async function loadRecommendations() {
      const content = document.getElementById("content");
      content.innerHTML = "<div class='empty'>Загружаю рекомендации...</div>";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            initData: getInitData()
          })
        });

        const data = await response.json();

        if (!data.artists || data.artists.length === 0) {
          content.innerHTML = `
            <div class="empty">
              Пока нет рекомендаций.<br>
              Найди треки в боте и нажми ❤️.
            </div>
          `;
          return;
        }

        content.innerHTML = "";

        for (const artist of data.artists) {
          const artistTitle = document.createElement("div");
          artistTitle.className = "artist";
          artistTitle.textContent = artist.name;
          content.appendChild(artistTitle);

          for (const track of artist.tracks) {
            const card = document.createElement("div");
            card.className = "track";

            card.innerHTML = `
              <img src="${track.cover || ""}" alt="">
              <div class="info">
                <div class="title">${track.title}</div>
                <div class="artist-name">${track.artist}</div>
              </div>
              <button class="play">▶</button>
            `;

            card.querySelector(".play").onclick = () => {
              if (track.preview) {
                const audio = new Audio(track.preview);
                audio.play();
              } else {
                tg.openLink(track.link);
              }
            };

            content.appendChild(card);
          }
        }
      } catch (error) {
        content.innerHTML = `
          <div class="empty">
            Не удалось загрузить рекомендации.<br>
            Попробуй ещё раз.
          </div>
        `;
      }
    }

    function refresh() {
      loadRecommendations();
    }

    loadRecommendations();
  </script>
</body>
</html>
